services:
  # Service is named "app" so the TLS overlay (docker-compose.tls.yml) and the
  # Caddyfile reverse_proxy target (app:5000) resolve it on the compose network.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: proctoring-ai-backend:latest
    container_name: proctoring-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Override individual values here if needed; .env takes precedence.
      PORT: 5000
    volumes:
      # Persist generated reports + logs and let you swap models without rebuilding.
      - ./models_data:/app/models_data:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./data:/app/data   # SQLite enrollment store
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
