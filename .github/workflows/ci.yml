name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what tests need. We skip the heavy CV stack in CI
          # because MOCK_MODELS=1 swaps it out for the stub system.
          pip install \
            "fastapi>=0.110,<1.0" \
            "uvicorn[standard]>=0.27,<1.0" \
            "python-multipart>=0.0.9" \
            "pydantic>=2.6,<3.0" \
            "slowapi>=0.1.9,<1.0" \
            "python-dotenv==1.0.0" \
            "numpy>=2.0.0" \
            "opencv-python-headless==4.10.0.84" \
            "httpx>=0.27,<1.0" \
            "pytest>=8.0,<9.0" \
            "pytest-asyncio>=0.23,<1.0" \
            "ruff>=0.5,<1.0"

      - name: Ruff lint
        run: |
          # Don't fail the build on style nits yet; surface them as warnings.
          ruff check . --output-format=github --exit-zero

      - name: Run pytest (mock mode)
        env:
          MOCK_MODELS: "1"
          API_KEY: ci-test-key
          API_KEY_REQUIRED: "true"
          ENVIRONMENT: development
        run: |
          pytest tests/ -v --tb=short

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: proctoring-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
